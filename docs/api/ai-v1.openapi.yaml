    "description": "API baca dengan token AI khusus. Izin akun, grant dataset/kolom, cakupan laporan, dan policy relasi diperiksa server. GET juga menyediakan HEAD bawaan. Tidak menyediakan penulisan atau pemanggilan model AI."

  "components": {
    "securitySchemes": {
      "SummaryToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Token Sanctum khusus ai:read dengan ai_access_grants; token SSO dan session saja ditolak."
      }
    },
    "parameters": {
      "fields": {
        "name": "fields",
        "in": "query",
        "required": false,
        "description": "CSV kolom yang diizinkan; default seluruh kolom grant pada dataset.",
        "schema": {
          "type": "string"
        }
      },
      "include": {
        "name": "include",
        "in": "query",
        "required": false,
        "description": "CSV relasi terdaftar yang diizinkan; tanpa relasi bertingkat bebas.",
        "schema": {
          "type": "string"
        }
      },
      "q": {
        "name": "q",
        "in": "query",
        "required": false,
        "description": "Pencarian literal hanya pada kolom teks yang diizinkan.",
        "schema": {
          "type": "string",
          "maxLength": 500
        }
      },
      "sort": {
        "name": "sort",
        "in": "query",
        "required": false,
        "description": "CSV kolom, awalan - untuk descending; ID penentu tambahan.",
        "schema": {
          "type": "string"
        }
      },
      "page": {
        "name": "page",
